apiVersion: v1
kind: Namespace
metadata:
  name: xailon-tf-prod
---
# ─────────────────────────────────────────────────────────────────────────────
# Azure Key Vault → tokenfactory-secrets
#
# This is exactly the model that runs in tokenfactory-prod with Vault — only the
# provider changed: Azure Key Vault CSI in place of HashiCorp Vault CSI.
#
#   Key Vault (kv-tokenfactory)
#     → SecretProviderClass (ye file)
#     → the syncer pod MOUNTS the volume        ← skipping this step is the big mistake
#     → the k8s Secret `tokenfactory-secrets` is created
#     → the chart reads it via global.secrets.existingSecret
#
# IMPORTANT: `secretObjects` creates no k8s Secret until some pod mounts that CSI
# volume. Applying the SPC on its own does nothing — the Secret is never created
# and every pod reports CreateContainerConfigError. Hence the syncer Deployment
# below (production uses the same pattern).
#
# The Secret MUST be named `tokenfactory-secrets` — six subcharts hardcode
# `<release>-secrets` and ignore global.secretsName, which is also why the Helm
# release has to be named `tokenfactory`.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tokenfactory-kv
  namespace: xailon-tf-prod
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # the CLIENT id of the AKS key_vault_secrets_provider addon's managed identity
    # (NOT the objectId — that one is for the role assignment).
    userAssignedIdentityID: "35f2629f-beb1-438e-8105-f3202518249d"
    keyvaultName: "kv-tokenfactory"
    tenantId: "6fc131bd-72da-4e55-bb85-5e873ab21dc6"
    objects: |
      array:
        - |
          objectName: admin-api-key
          objectType: secret
        - |
          objectName: auth-state-signing-key
          objectType: secret
        - |
          objectName: ce-userinfo-signing-key
          objectType: secret
        - |
          objectName: db-password
          objectType: secret
        - |
          objectName: encryption-key
          objectType: secret
        - |
          objectName: google-client-secret
          objectType: secret
        - |
          objectName: kc-admin-password
          objectType: secret
        - |
          objectName: kc-admin-username
          objectType: secret
        - |
          objectName: kc-db-password
          objectType: secret
        - |
          objectName: microsoft-client-secret
          objectType: secret
        - |
          objectName: platform-admin-password
          objectType: secret
        - |
          objectName: platform-init-admin-password
          objectType: secret
        - |
          objectName: portal-jwt-secret
          objectType: secret
        - |
          objectName: redis-password
          objectType: secret
        - |
          objectName: s3-access-key
          objectType: secret
        - |
          objectName: s3-secret-key
          objectType: secret
        - |
          objectName: smtp-password
          objectType: secret
        - |
          objectName: stripe-secret-key
          objectType: secret
        - |
          objectName: stripe-webhook-secret
          objectType: secret
  secretObjects:
    - secretName: tokenfactory-secrets
      type: Opaque
      data:
        - { objectName: admin-api-key,                key: admin-api-key }
        - { objectName: auth-state-signing-key,       key: auth-state-signing-key }
        - { objectName: ce-userinfo-signing-key,      key: ce-userinfo-signing-key }
        - { objectName: db-password,                  key: db-password }
        - { objectName: encryption-key,               key: encryption-key }
        - { objectName: google-client-secret,         key: google-client-secret }
        - { objectName: kc-admin-password,            key: kc-admin-password }
        - { objectName: kc-admin-username,            key: kc-admin-username }
        - { objectName: kc-db-password,               key: kc-db-password }
        - { objectName: microsoft-client-secret,      key: microsoft-client-secret }
        - { objectName: platform-admin-password,      key: platform-admin-password }
        - { objectName: platform-init-admin-password, key: platform-init-admin-password }
        - { objectName: portal-jwt-secret,            key: portal-jwt-secret }
        - { objectName: redis-password,               key: redis-password }
        - { objectName: s3-access-key,                key: s3-access-key }
        - { objectName: s3-secret-key,                key: s3-secret-key }
        - { objectName: smtp-password,                key: smtp-password }
        - { objectName: stripe-secret-key,            key: stripe-secret-key }
        - { objectName: stripe-webhook-secret,        key: stripe-webhook-secret }
---
# Syncer — its only job is to keep the volume mounted so the Secret keeps
# existing. Rotation is enabled on the addon (2m poll), so when a value changes in
# Key Vault it updates the k8s Secret by itself. The pods still need a restart —
# env vars are only read at pod start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akv-secret-syncer
  namespace: xailon-tf-prod
  labels: { app.kubernetes.io/name: akv-secret-syncer }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: akv-secret-syncer }
  template:
    metadata:
      labels: { app.kubernetes.io/name: akv-secret-syncer }
    spec:
      containers:
        - name: pause
          image: acrtokenfactory.azurecr.io/busybox:1.36
          command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: kv
              mountPath: /mnt/kv
              readOnly: true
      volumes:
        - name: kv
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: tokenfactory-kv
