# ─────────────────────────────────────────────────────────────────────────────
# Argo CD → access to the private GitHub repo
#
# The repo is private, so Argo's repo-server needs credentials. HTTPS plus a PAT
# is the most direct route (an SSH deploy key also works, but then known_hosts
# has to be configured as well).
#
# PAT scope: `repo` (or "Contents: Read-only" on a fine-grained PAT).
# This can be the SAME PAT used for the GHCR import if it carries both scopes —
# otherwise create a separate one.
#
# Storing it in Key Vault as well (`github-pat`) is worthwhile, so it does not
# have to be recreated.
#
#   kubectl apply -f argocd-repo-secret.yaml
#   # then it appears under Argo UI → Settings → Repositories with status "Successful"
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: repo-ai-gateway-platform
  namespace: argocd
  labels:
    # This label is MANDATORY — without it Argo does not treat this as a repo credential
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/Infinia-Technology/ai-gateway-platform.git
  username: <github-username>
  password: <PAT>
